name: Validate and deploy Jekyll

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Validate output
        run: python3 scripts/validate_site.py _site
      - name: Verify a non-empty base path
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --strict_front_matter --baseurl /preview --destination _site-preview
          python3 scripts/validate_site.py _site-preview /preview
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
